<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoSafra - Alimentos da Época</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">
        🌱 EcoSafra
    </div>

    <nav>
        <a href="#">Início</a>
        <a href="#">Sustentabilidade</a>
        <a href="#">Contato</a>
    </nav>
</header>

<section class="hero">

    <div class="hero-content">

        <h1>Descubra os alimentos da época</h1>

        <p>
            Consuma alimentos sazonais e reduza os impactos ambientais
            causados pelo transporte e armazenamento excessivo.
        </p>

        <select id="mes">
            <option value="">Escolha um mês</option>

            <option value="Janeiro">Janeiro</option>
            <option value="Fevereiro">Fevereiro</option>
            <option value="Março">Março</option>
            <option value="Abril">Abril</option>
            <option value="Maio">Maio</option>
            <option value="Junho">Junho</option>
            <option value="Julho">Julho</option>
            <option value="Agosto">Agosto</option>
            <option value="Setembro">Setembro</option>
            <option value="Outubro">Outubro</option>
            <option value="Novembro">Novembro</option>
            <option value="Dezembro">Dezembro</option>

        </select>

    </div>

</section>

<section class="resultado">

    <h2>Alimentos Recomendados</h2>

    <div id="cards" class="cards"></div>

</section>

<footer>
    <p>🌎 Incentivando o consumo sustentável através da sazonalidade.</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
